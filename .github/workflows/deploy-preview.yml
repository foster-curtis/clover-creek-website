name: Deploy preview

on:
  push:
    branches: [stg]

# A newer push to stg supersedes an in-flight preview build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  NEXT_TELEMETRY_DISABLED: "1"
  VERCEL_CLI_VERSION: "59"

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  preview:
    name: Preview deploy
    needs: quality
    runs-on: ubuntu-latest
    # Publishes the deployment URL as a GitHub environment, which puts a
    # clickable link on the workflow run page and in the repo's Environments.
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      # "Cannot load project settings" from vercel pull is really an HTTP 403
      # (vercel/vercel#10874). Name the account and scope up front so a
      # permissions problem does not masquerade as a missing directory.
      - name: Verify Vercel access
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing - add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Token belongs to: $(vercel whoami --token="$VERCEL_TOKEN" 2>&1 || echo "<token rejected>")"
          echo "Target scope:     $VERCEL_ORG_ID"
          echo "Target project:   $VERCEL_PROJECT_ID"
          echo "Teams visible to this token:"
          vercel teams ls --token="$VERCEL_TOKEN" 2>&1 | sed "s/^/  /" || true

      # Pulls this project's Preview environment variables from Vercel, so the
      # build sees the same values production does. Nothing is written back.
      - name: Pull Vercel environment
        run: |
          if ! vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"; then
            echo "::error::vercel pull failed. If it reported \"Cannot load project settings\", that is an HTTP 403 - this token cannot reach project $VERCEL_PROJECT_ID in scope $VERCEL_ORG_ID. Mint the token from the Vercel account that belongs to that team; removing .vercel does not help here."
            exit 1
          fi

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          # The CLI streams progress to stderr and prints the deployment URL
          # as the last line of stdout; take that line so no stray output can
          # end up inside the link.
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::Deploy finished but no deployment URL was returned."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Preview deploy::$url"
          {
            echo "## Preview ready"
            echo
            echo "### [$url]($url)"
            echo
            echo "Deployed from ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}"
          } >> "$GITHUB_STEP_SUMMARY"
